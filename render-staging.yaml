services:
  - type: web
    name: ucc-growthplus-staging
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /var/data
      - key: SQLITE_PATH
        value: /var/data/ucc-microcredentials.sqlite
      - key: AUTH_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PILOT_REQUIRE_OFFICIAL_DOMAIN
        value: "false"
      - key: PLATFORM_MODE
        value: demonstration
      - key: EMERGENCY_DEMONSTRATION_MODE
        value: "false"
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "false"
      - key: PILOT_MAX_LEARNERS
        value: "10"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: STAFF_MFA_REQUIRED
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: UCC Growth+ <onboarding@resend.dev>
      - key: SUPPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MONITORING_WEBHOOK_URL
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: AUTO_BACKUP_ENABLED
        value: "true"
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_RETENTION_DAYS
        value: "7"
      - key: IDENTITY_RETENTION_DAYS
        value: "30"
      - key: NEXT_PUBLIC_ENABLE_DEMO_CONTENT
        value: "true"
    disk:
      name: ucc-growthplus-staging-data
      mountPath: /var/data
      sizeGB: 2
