name: Platform quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --include=dev
      - run: npm run pilot:check
      - run: npm run test:lti:api
      - name: Install browser test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check public discovery in a browser
        run: npm run test:discovery
      - name: Check the learner workspace in a browser
        run: npm run test:browser
